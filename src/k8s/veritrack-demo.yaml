# Optional: run the Stage 2 backend on Kubernetes instead of docker-compose,
# for demos where showing k8s specifically matters. This is a secondary path —
# docker-compose.yml is the simpler default. Same non-goal applies here even
# more strongly: do NOT try to route a USB webcam into this cluster. Run the
# webcam demo natively on Windows and point it at the gateway Service exposed
# below via `kubectl port-forward` (works the same whether the cluster is
# `kind`, `minikube`, or Docker Desktop's built-in Kubernetes).
#
# Usage:
#   kubectl create namespace veritrack
#   kubectl -n veritrack create secret generic veritrack-crypto \
#       --from-literal=aes-master-key="$(openssl rand -base64 32)" \
#       --from-literal=salt-pepper="$(openssl rand -base64 64)"
#   kubectl apply -f k8s/veritrack-demo.yaml
#   kubectl -n veritrack rollout status deployment/gateway
#   kubectl -n veritrack port-forward svc/gateway 8080:8080
#   curl http://localhost:8080/healthz
#
# You must build and load the gateway image first, since this manifest does
# not push anywhere:
#   docker build -f Dockerfile.gateway -t veritrack-gateway:demo .
#   kind load docker-image veritrack-gateway:demo         # kind
#   minikube image load veritrack-gateway:demo            # minikube
#   # Docker Desktop Kubernetes shares the local image cache automatically.

apiVersion: v1
kind: Namespace
metadata:
  name: veritrack

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-schema
  namespace: veritrack
data:
  init_schema.sql: |
    -- Populated from veritrack_server/sql/init_schema.sql by:
    --   kubectl -n veritrack create configmap init-schema \
    --       --from-file=init_schema.sql=veritrack_server/sql/init_schema.sql \
    --       --dry-run=client -o yaml > /tmp/cm.yaml
    -- then merge that data: block in here. Left as a placeholder because the
    -- real file is ~450 lines; regenerating it keeps this manifest in sync
    -- with the DDL automatically instead of risking a stale inlined copy.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: veritrack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: veritrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: timescaledb}
  template:
    metadata:
      labels: {app: timescaledb}
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb-ha:pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: veritrack}
            - {name: POSTGRES_PASSWORD, value: veritrack}
            - {name: POSTGRES_DB, value: veritrack}
          volumeMounts:
            - {name: pgdata, mountPath: /home/postgres/pgdata/data}
            - {name: init-schema, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "veritrack"]}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - {name: pgdata, persistentVolumeClaim: {claimName: pgdata}}
        - {name: init-schema, configMap: {name: init-schema}}

---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: veritrack
spec:
  selector: {app: timescaledb}
  ports: [{port: 5432, targetPort: 5432}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: veritrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: veritrack
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: veritrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: veritrack-gateway:demo
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: VERITRACK_ENVIRONMENT, value: dev}
            - {name: VERITRACK_DB_HOST, value: timescaledb}
            - {name: VERITRACK_DB_USER, value: veritrack}
            - {name: VERITRACK_DB_PASSWORD, value: veritrack}
            - {name: VERITRACK_DB_DATABASE, value: veritrack}
            - {name: VERITRACK_REDIS_HOST, value: redis}
            - {name: VERITRACK_REDIS_REQUIRED, value: "true"}
            - {name: VERITRACK_SERVER_ENABLE_DOCS, value: "true"}
            - name: VERITRACK_CRYPTO_AES_MASTER_KEY
              valueFrom: {secretKeyRef: {name: veritrack-crypto, key: aes-master-key}}
            - name: VERITRACK_CRYPTO_SALT_PEPPER
              valueFrom: {secretKeyRef: {name: veritrack-crypto, key: salt-pepper}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: veritrack
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
